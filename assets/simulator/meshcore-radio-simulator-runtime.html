<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MeshCore Radio Simulator</title>
</head>
<body>
<p id="loader-status">Loading simulator…</p>
<script>
(() => {
  "use strict";

  const sourceUrl = "./meshcore-radio-simulator.html?v=20260724b";

  const replaceSection = (source, startMarker, endMarker, replacement) => {
    const start = source.indexOf(startMarker);
    const end = source.indexOf(endMarker, start);
    if (start < 0 || end < 0) {
      throw new Error("Simulator patch target was not found.");
    }
    return source.slice(0, start) + replacement + "\n\n" + source.slice(end);
  };

  const generatorPatch = `      const baseRepeaterPositions = (count) => {
        if (count === 2) {
          return [
            [0.33, 0.54],
            [0.64, 0.56]
          ];
        }

        if (count === 3) {
          return [
            [0.27, 0.55],
            [0.50, 0.42],
            [0.73, 0.54]
          ];
        }

        const positions = [
          [0.22, 0.58],
          [0.43, 0.40],
          [0.43, 0.72],
          [0.70, 0.55]
        ];
        const extraPositions = [
          [0.18, 0.34],
          [0.34, 0.24],
          [0.58, 0.26],
          [0.82, 0.36],
          [0.24, 0.82],
          [0.52, 0.84],
          [0.79, 0.76],
          [0.55, 0.56],
          [0.34, 0.57],
          [0.61, 0.68],
          [0.68, 0.36],
          [0.16, 0.70],
          [0.84, 0.58],
          [0.48, 0.18],
          [0.48, 0.88],
          [0.76, 0.20]
        ];

        for (let i = positions.length; i < count; i += 1) {
          positions.push(extraPositions[(i - 4) % extraPositions.length]);
        }
        return positions;
      };

      const shuffled = (items) => {
        const result = items.slice();
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      };

      const chooseTerrainSlots = (count, interiorSlots, edgeSlots, interiorShare = 0.6) => {
        const interiorCount = Math.min(
          interiorSlots.length,
          Math.ceil(count * interiorShare)
        );
        const edgeCount = Math.min(edgeSlots.length, count - interiorCount);
        return shuffled(
          shuffled(interiorSlots).slice(0, interiorCount)
            .concat(shuffled(edgeSlots).slice(0, edgeCount))
        );
      };

      const mountainInteriorSlots = [
        [0.31, 0.36, 0.15, 0.11],
        [0.53, 0.34, 0.18, 0.12],
        [0.42, 0.64, 0.17, 0.13],
        [0.69, 0.60, 0.15, 0.11]
      ];

      const mountainEdgeSlots = [
        [0.25, 0.15, 0.16, 0.10],
        [0.66, 0.15, 0.18, 0.10],
        [0.14, 0.65, 0.13, 0.09],
        [0.86, 0.36, 0.13, 0.09],
        [0.69, 0.86, 0.18, 0.10],
        [0.30, 0.86, 0.16, 0.10]
      ];

      const woodInteriorSlots = [
        [0.25, 0.33],
        [0.45, 0.28],
        [0.67, 0.35],
        [0.33, 0.52],
        [0.55, 0.50],
        [0.76, 0.57],
        [0.43, 0.72],
        [0.64, 0.73]
      ];

      const woodEdgeSlots = [
        [0.14, 0.17],
        [0.38, 0.14],
        [0.69, 0.16],
        [0.87, 0.25],
        [0.87, 0.76],
        [0.69, 0.86],
        [0.34, 0.87],
        [0.13, 0.76]
      ];

      const createCandidateMap = () => {
        const repeaterCount = Number(repeatersInput.value);
        const mountainCount = Number(mountainsInput.value);
        const woodCount = Number(woodsInput.value);
        const nextNodes = [
          { id: "source", name: "User A", kind: "companion", nx: 0.07, ny: 0.60, rangeFactor: 0.54 },
          { id: "target", name: "User B", kind: "companion", nx: 0.93, ny: 0.52, rangeFactor: 0.54 },
          { id: "listener-1", name: "User C", kind: "companion", nx: 0.72, ny: 0.12, rangeFactor: 0.50 },
          { id: "listener-2", name: "User D", kind: "companion", nx: 0.21, ny: 0.90, rangeFactor: 0.50 }
        ];

        baseRepeaterPositions(repeaterCount).forEach((base, index) => {
          const jitter = 0.014;
          nextNodes.push({
            id: "r" + (index + 1),
            name: "R" + (index + 1),
            kind: "repeater",
            nx: Math.min(0.90, Math.max(0.10, base[0] + (Math.random() - 0.5) * jitter)),
            ny: Math.min(0.90, Math.max(0.10, base[1] + (Math.random() - 0.5) * jitter)),
            rangeFactor: 0.55 + Math.random() * 0.025
          });
        });

        const nextMountains = [];
        chooseTerrainSlots(
          mountainCount,
          mountainInteriorSlots,
          mountainEdgeSlots
        ).forEach((slot) => {
          nextMountains.push(makeMountain(
            slot[0] + (Math.random() - 0.5) * 0.055,
            slot[1] + (Math.random() - 0.5) * 0.045,
            slot[2] * (0.90 + Math.random() * 0.20),
            slot[3] * (0.90 + Math.random() * 0.20)
          ));
        });

        const nextWoods = [];
        chooseTerrainSlots(
          woodCount,
          woodInteriorSlots,
          woodEdgeSlots
        ).forEach((slot) => {
          nextWoods.push(makeWood(
            slot[0] + (Math.random() - 0.5) * 0.070,
            slot[1] + (Math.random() - 0.5) * 0.060,
            0.055 + Math.random() * 0.035,
            0.045 + Math.random() * 0.030
          ));
        });

        return { nextNodes, nextMountains, nextWoods };
      };`;

  const mapPatch = `      const generateMap = (resetHistory = false) => {
        clearRun();
        if (resetHistory) clearLog();

        const applyCandidate = (candidate) => {
          nodes = candidate.nextNodes;
          mountains = candidate.nextMountains;
          woods = candidate.nextWoods;
        };

        let preferred = null;
        let connected = null;

        for (let attempt = 0; attempt < 120; attempt += 1) {
          const candidate = createCandidateMap();
          applyCandidate(candidate);
          const path = findPath();
          if (!path) continue;

          const broken = chooseBrokenRoute(path);
          const result = { candidate, path, broken };
          if (!connected) connected = result;
          if (broken) {
            preferred = result;
            break;
          }
        }

        let selected = preferred || connected;
        if (!selected) {
          const candidate = createCandidateMap();
          candidate.nextNodes.forEach((node) => {
            node.rangeFactor = Math.max(node.rangeFactor, node.kind === "repeater" ? 0.68 : 0.62);
          });
          applyCandidate(candidate);
          const path = findPath();
          selected = {
            candidate,
            path,
            broken: path ? chooseBrokenRoute(path) : null
          };
        } else {
          applyCandidate(selected.candidate);
        }

        storedRoute = selected.path ? selected.path.slice(1, -1) : [];
        brokenNodeId = selected.broken
          ? selected.broken.candidate
          : (storedRoute.length ? storedRoute[Math.floor(storedRoute.length / 2)] : null);
        alternateRoute = selected.broken ? selected.broken.alternative.slice(1, -1) : [];
        routeOverlay = scenarioInput.value === "known-direct" || scenarioInput.value === "broken-route"
          ? storedRoute.slice()
          : [];
        hideNextStep();
        runButton.textContent = "Run message";
        setStatus(
          selected.path
            ? "Ready. User A will send to User B."
            : "This map has no complete route. Generate another map or add repeaters.",
          selected.path && scenarioInput.value === "known-direct" ? "Direct" : "Flood"
        );
      };`;

  fetch(sourceUrl, { cache: "no-store" })
    .then((response) => {
      if (!response.ok) throw new Error("Could not load the simulator source.");
      return response.text();
    })
    .then((html) => {
      let patched = replaceSection(
        html,
        "      const baseRepeaterPositions = [",
        "      const chooseBrokenRoute = (route) => {",
        generatorPatch
      );
      patched = replaceSection(
        patched,
        "      const generateMap = (resetHistory = false) => {",
        "      const clearTimers = () => {",
        mapPatch
      );
      document.open();
      document.write(patched);
      document.close();
    })
    .catch((error) => {
      const status = document.getElementById("loader-status");
      if (status) status.textContent = "The simulator could not load. " + error.message;
    });
})();
</script>
</body>
</html>
